name: Publish to npm
permissions:
  contents: read
  id-token: write
on:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    # A manual dispatch must never publish from an arbitrary feature branch.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint:ci
      - name: Check code formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Build the project
        run: npm run build
      - name: Check bundle size
        run: npm run test:bundle
      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME resolves to version $TAG_VERSION but package.json is $PACKAGE_VERSION. Bump package.json and re-tag."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME matches package.json version $PACKAGE_VERSION"
      - name: Check if version already published
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          set +e
          VIEW_OUTPUT=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>&1)
          VIEW_STATUS=$?
          set -e
          echo "$VIEW_OUTPUT"

          if [ "$VIEW_STATUS" -eq 0 ]; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is already published on npm"
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          elif echo "$VIEW_OUTPUT" | grep -q 'E404'; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is not published yet"
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          else
            # A registry outage or auth failure must not be read as "not published".
            echo "::error::Could not determine whether $PACKAGE_NAME@$PACKAGE_VERSION is published."
            exit 1
          fi
      - name: Fail if the released version is already on npm
        if: github.event_name == 'release' && steps.version-check.outputs.already-published == 'true'
        run: |
          echo "::error::Version already on npm, so this release would publish nothing. Bump the version before releasing."
          exit 1
      - name: Publish to npm
        if: steps.version-check.outputs.already-published == 'false'
        run: npm publish --access public
